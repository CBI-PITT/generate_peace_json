<!-- Shared file browser picker modal (chrome-less browser iframe) -->
<div class="modal fade" id="fileBrowserModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Select a File or Folder</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body p-0">
                <iframe id="fileBrowserFrame" src="" style="width: 100%; height: 70vh; border: 0;" data-field-id=""></iframe>
            </div>
        </div>
    </div>
</div>
