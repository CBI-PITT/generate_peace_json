<!-- Shared file browser picker modal (chrome-less browser iframe) -->
<div class="modal fade" id="fileBrowserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered peace-browser-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="d-flex align-items-center gap-2 min-w-0">
                    <i class="bi bi-folder2-open peace-modal-icon" aria-hidden="true"></i>
                    <div class="min-w-0">
                        <div class="peace-modal-kicker">File Browser</div>
                        <h6 class="modal-title">Select a File or Folder</h6>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <iframe id="fileBrowserFrame" src="" style="width: 100%; height: 70vh; border: 0;" data-field-id=""></iframe>
            </div>
        </div>
    </div>
</div>
