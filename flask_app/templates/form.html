<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ operation }} Settings</title>
</head>
<body>
    <h1>{{ operation.capitalize() }} Settings</h1>
    <form method="post">
        {{ form.hidden_tag() }}
        {% for field in form %}
            <div>
                {{ field.label }} {{ field }}
            </div>
        {% endfor %}
        <button type="submit">Submit</button>
    </form>
</body>
</html>
