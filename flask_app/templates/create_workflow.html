{% extends "base.html" %}
{% block title %}Create Workflow{% endblock %}

{% block content %}
<div class="container py-5">
        <h2 class="mb-4">Create a New Workflow</h2>

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="template-name" class="form-label">Template Name</label>
                        <input type="text" id="template-name" class="form-control" placeholder="e.g., cell_counting_standard">
                    </div>
                    <div class="col-md-3">
                        <label for="saved-template" class="form-label">Saved Templates</label>
                        <select id="saved-template" class="form-select">
                            <option value="">-- Select a template --</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button id="save-template" class="btn btn-outline-primary">Save Template</button>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button id="load-template" class="btn btn-outline-secondary">Load Template</button>
                    </div>
                    <div class="col-md-1 d-grid">
                        <button id="delete-template" class="btn btn-outline-danger">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Operation Selection -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-center">
                    <div class="col-md-5">
                        <label for="operation" class="form-label">Select Operation</label>
                        <select id="operation" class="form-select">
                          <option value="">-- Choose an operation --</option>
                          {% for category, operations in available_operations.items() %}
                            <optgroup label="{{ category }}">
                              {% for op in operations %}
                                <option value="{{ op }}">{{ op }}</option>
                              {% endfor %}
                            </optgroup>
                          {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3 align-self-end">
                        <button id="load-operation" class="btn btn-primary">Load Settings</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dynamic Form -->
        <div id="form-container" class="mb-4"></div>

        <!-- Additional Controls -->
        <div id="operation-controls" class="card mb-4" style="display: none;">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-10">
                        <label for="output-name" class="form-label">Output Name</label>
                        <input type="text" id="output-name" class="form-control" placeholder="e.g., processed_data">
                    </div>
                    <div class="col-md-2 d-grid align-items-end">
                        <button id="add-step" class="btn btn-success mt-3">Add Step</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Workflow Preview -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Workflow Steps</h5>
            </div>
            <ul class="list-group list-group-flush" id="workflow-steps"></ul>
        </div>

        <!-- Submit -->
        <div class="d-grid">
            <button id="submit-workflow" class="btn btn-dark btn-lg">Save Workflow</button>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
let workflow = { steps: [] };

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function fieldIdForStep(stepIndex, fieldName) {
    return `workflow-step-${stepIndex}-${fieldName.replace(/[^a-zA-Z0-9_-]/g, "-")}`;
}

let lastBrowserPath = "/browser/dir/";

function updateBrowserLocation(fieldId) {
    const iframe = document.querySelector(`#browser-${fieldId} iframe`);
    if (iframe && lastBrowserPath && iframe.getAttribute("src") !== lastBrowserPath) {
        iframe.setAttribute("src", lastBrowserPath);
    }
}

function renderWorkflowSteps() {
    const list = $("#workflow-steps");
    list.empty();

    workflow.steps.forEach((step, index) => {
        const bindings = Object.entries(step.input || {});
        const mutableFields = (step.mutable_fields || []).filter(fieldName => !(fieldName in (step.input || {})));
        const editableFields = Object.entries(step.editable_fields || {}).filter(([fieldName]) => {
            return !(fieldName in (step.input || {})) && !mutableFields.includes(fieldName);
        });

        const mutableFieldsHtml = mutableFields.map(fieldName => {
            const fieldId = fieldIdForStep(index, fieldName);
            const value = step.extras?.[fieldName] || "";
            return `
                <div class="mt-2">
                    <label class="form-label small text-muted mb-1">${escapeHtml(fieldName)}</label>
                    <input type="hidden" id="${escapeHtml(fieldId)}" value="${escapeHtml(value)}" data-step-index="${index}" data-field-name="${escapeHtml(fieldName)}">
                    <div id="selected-name-${escapeHtml(fieldId)}" class="form-text text-muted fst-italic mb-2">${value ? `Selected: ${escapeHtml(value)}` : 'No file selected'}</div>
                    <button type="button" class="btn btn-outline-secondary btn-sm browse-btn" data-target="${escapeHtml(fieldId)}">
                        Browse <span class="arrow">▼</span>
                    </button>
                    <div class="file-browser-container mt-2" id="browser-${escapeHtml(fieldId)}" style="display: none; border: 1px solid #ccc; padding: 10px;">
                        <iframe name="iframe-input-${escapeHtml(fieldId)}"
                            src="/browser/dir/"
                            width="100%" height="300px"
                            frameborder="0"
                            data-field-id="${escapeHtml(fieldId)}">
                        </iframe>
                    </div>
                </div>
            `;
        }).join("");

        const editableFieldsHtml = editableFields.map(([fieldName, fieldConfig]) => {
            const rawValue = step.extras?.[fieldName];
            const value = rawValue === undefined || rawValue === null || rawValue === ""
                ? (fieldConfig.default_value ?? "")
                : rawValue;
            const fieldType = fieldConfig.field_type || "text";
            const label = fieldConfig.label || fieldName;

            if (fieldType === "select") {
                const options = Array.isArray(fieldConfig.options) ? fieldConfig.options : [];
                const optionsHtml = options.map(option => {
                    const optionValue = typeof option === "string" ? option : option.value;
                    const optionLabel = typeof option === "string" ? option : (option.label ?? option.value);
                    const selected = String(optionValue) === String(value) ? ' selected' : '';
                    return `<option value="${escapeHtml(optionValue)}"${selected}>${escapeHtml(optionLabel)}</option>`;
                }).join("");

                return `
                    <div class="mt-2">
                        <label class="form-label small text-muted mb-1">${escapeHtml(label)}</label>
                        <select
                            class="form-select form-select-sm workflow-editable-field"
                            data-step-index="${index}"
                            data-field-name="${escapeHtml(fieldName)}"
                            data-field-type="${escapeHtml(fieldType)}">
                            ${optionsHtml}
                        </select>
                    </div>
                `;
            }

            const inputType = ["number", "integer", "float"].includes(fieldType) ? "number" : "text";
            return `
                <div class="mt-2">
                    <label class="form-label small text-muted mb-1">${escapeHtml(label)}</label>
                    <input
                        type="${escapeHtml(inputType)}"
                        class="form-control form-control-sm workflow-editable-field"
                        data-step-index="${index}"
                        data-field-name="${escapeHtml(fieldName)}"
                        data-field-type="${escapeHtml(fieldType)}"
                        value="${escapeHtml(value)}">
                </div>
            `;
        }).join("");

        list.append(`
            <li class="list-group-item">
                <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
                    <div>
                        <strong>Step ${index + 1}:</strong> ${escapeHtml(step.operation)}
                        <div class="text-muted small mt-1">Inputs: ${bindings.map(([key, value]) => `${escapeHtml(key)} ← ${escapeHtml(value)}`).join(", ") || 'none'}</div>
                        <div class="text-muted small">Output: ${escapeHtml(step.output || '') || 'none'}</div>
                    </div>
                    <div class="flex-grow-1" style="min-width: 280px;">
                        ${editableFieldsHtml}
                        ${mutableFieldsHtml}
                    </div>
                </div>
            </li>
        `);
    });
}

function fetchTemplates(selectedSlug = "") {
    $.getJSON("/workflow/templates", function (data) {
        const select = $("#saved-template");
        select.empty();
        select.append('<option value="">-- Select a template --</option>');
        (data.templates || []).forEach(function (template) {
            select.append(`<option value="${escapeHtml(template.slug)}">${escapeHtml(template.name)}</option>`);
        });
        if (selectedSlug) {
            select.val(selectedSlug);
        }
    });
}

// Load the operation form and inject bindable dropdowns
$("#load-operation").on("click", function () {
    const op = $("#operation").val();
    if (!op) return;

    $.post("/workflow/operation_form", { operation: op }, function (data) {
        $("#form-container").html(`<div class="card"><div class="card-body">${data.form_html}</div></div>`);
        $("#operation-controls").show();
        addOutputBindings();  // <-- insert dropdowns for binding previous outputs
        setupBrowseButtons();  // <-- setup "Browse" buttons & iframe toggle
    });
});

// Add step to workflow
$("#add-step").on("click", function () {
    const operation = $("#operation").val();
    const output = $("#output-name").val();

    // Collect field-to-output bindings
    const inputBindings = {};
    $("#form-container").find("select[data-bind-target]").each(function () {
        const field = $(this).attr("data-bind-target");
        const val = $(this).val();
        if (val) inputBindings[field] = val;
    });

    // Collect form data (excluding bound fields)
    const formData = {};
    const processedFields = new Set();
    const mutableFields = [];
    const editableFields = {};

    $("#form-container").find("[data-workflow-mutable='true']").each(function () {
        const name = $(this).attr("name");
        if (name) {
            mutableFields.push(name);
        }
    });

    $("#form-container").find("[data-workflow-editable='true']").each(function () {
        const name = $(this).attr("name");
        const fieldId = $(this).attr("id");
        const label = fieldId ? $("#form-container").find(`label[for='${fieldId}']`).first().text().trim() : "";
        const fieldType = $(this).attr("data-workflow-field-type") || $(this).attr("type") || "text";
        const defaultValue = $(this).attr("data-default-value");
        if (name) {
            editableFields[name] = {
                label: label || name,
                field_type: fieldType,
                default_value: defaultValue
            };
            if (fieldType === "select") {
                editableFields[name].options = $(this).find("option").map(function () {
                    return {
                        value: $(this).attr("value"),
                        label: $(this).text()
                    };
                }).get();
            }
        }
    });

    $("#form-container").find("input, select, textarea").each(function () {
        const name = $(this).attr("name");
        if (!name || name in inputBindings || processedFields.has(name)) return;

        const type = $(this).attr("type");

        if (type === "checkbox") {
            formData[name] = $(this).is(":checked");
        } else if (type === "radio") {
            const checked = $(`input[name="${name}"]:checked`).val();
            if (checked !== undefined) {
                formData[name] = checked;
            }
            processedFields.add(name);
        } else if (type === "number") {
            const val = $(this).val();
            const fallback = $(this).attr("data-default-value");
            const valueToParse = val === "" ? fallback : val;
            const workflowFieldType = $(this).attr("data-workflow-field-type") || "number";
            if (valueToParse === "" || valueToParse === undefined) {
                formData[name] = null;
            } else if (workflowFieldType === "integer") {
                formData[name] = parseInt(valueToParse, 10);
            } else {
                formData[name] = parseFloat(valueToParse);
            }
        } else {
            const val = $(this).val();
            const fallback = $(this).attr("data-default-value");
            formData[name] = val === "" && fallback !== undefined ? fallback : val;
        }

        processedFields.add(name);
    });

    workflow.steps.push({
        input: inputBindings,
        output,
        operation,
        extras: formData,
        mutable_fields: [...new Set(mutableFields)],
        editable_fields: editableFields
    });

    renderWorkflowSteps();

    // Reset
    $("#form-container").empty();
    $("#operation-controls").hide();
    $("#output-name").val("");
});

// Save entire workflow
$("#submit-workflow").on("click", function () {
    $.ajax({
        url: "/workflow/new",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(workflow),
        success: function () {
            alert("Workflow saved!");
            workflow.steps = [];
            renderWorkflowSteps();
            $("#input-source").html('<option value="">None</option>');
        }
    });
});

$("#save-template").on("click", function () {
    const name = $("#template-name").val().trim();
    if (!name) {
        alert("Please enter a template name.");
        return;
    }
    $.ajax({
        url: "/workflow/templates/save",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({
            name,
            workflow
        }),
        success: function (data) {
            fetchTemplates(data.template.slug);
            alert("Template saved!");
        },
        error: function (xhr) {
            alert(xhr.responseJSON?.error || "Failed to save template.");
        }
    });
});

$("#load-template").on("click", function () {
    const slug = $("#saved-template").val();
    if (!slug) return;
    $.getJSON(`/workflow/templates/${slug}`, function (data) {
        workflow = data.workflow || { steps: [] };
        $("#template-name").val(data.name || slug);
        renderWorkflowSteps();
    }).fail(function (xhr) {
        alert(xhr.responseJSON?.error || "Failed to load template.");
    });
});

$("#delete-template").on("click", function () {
    const slug = $("#saved-template").val();
    const templateName = $("#saved-template option:selected").text();
    if (!slug) {
        alert("Please select a template to delete.");
        return;
    }
    if (!window.confirm(`Delete template \"${templateName}\"?`)) {
        return;
    }

    $.ajax({
        url: `/workflow/templates/${slug}/delete`,
        method: "POST",
        success: function () {
            if ($("#template-name").val().trim() === templateName) {
                $("#template-name").val("");
            }
            if ($("#saved-template").val() === slug) {
                workflow = { steps: [] };
                renderWorkflowSteps();
            }
            fetchTemplates();
            alert("Template deleted.");
        },
        error: function (xhr) {
            alert(xhr.responseJSON?.error || "Failed to delete template.");
        }
    });
});

// Add dropdowns to bind fields to previous step outputs
function addOutputBindings() {
    const outputs = workflow.steps.map(s => s.output);

    $("#form-container").find("input[data-bindable='true'], select[data-bindable='true'], textarea[data-bindable='true']").each(function () {
        const fieldEl = $(this);
        const fieldName = fieldEl.attr("name");
        if (!fieldName) return;

        const inputType = fieldEl.attr("type");

        // Skip number fields (IntegerField / FloatField)
        if (inputType === "number") return;

        const label = $(`label[for='${fieldName}']`);
        const wrapper = $("<div class='form-text small text-muted mb-2'>Link this field to output of a previous step:</div>");

        // Create the binding dropdown
        const bindingSelector = $("<select class='form-select form-select-sm mt-1'>")
            .attr("data-bind-target", fieldName)
            .append(`<option value="">-- None --</option>`);

        outputs.forEach(output => {
            bindingSelector.append(`<option value="${output}">${output}</option>`);
        });

        // Watch for change
        bindingSelector.on("change", function () {
            const selectedOutput = $(this).val();
            if (selectedOutput) {
                fieldEl.prop("disabled", true).addClass("bg-light text-muted");
            } else {
                fieldEl.prop("disabled", false).removeClass("bg-light text-muted");
            }
        });

        fieldEl.after(bindingSelector);
        fieldEl.after(wrapper);
    });
}

function setupBrowseButtons() {
    $(document).off("click.workflowBrowse", ".browse-btn");
    $(document).on("click.workflowBrowse", ".browse-btn", function () {
        const fieldId = $(this).data("target");
        const browser = $("#browser-" + fieldId);
        const arrow = $(this).find(".arrow");

        const isVisible = browser.is(":visible");
        if (!isVisible) {
            updateBrowserLocation(fieldId);
        }
        browser.toggle();
        arrow.text(isVisible ? "▼" : "▲");
    });

}
window.addEventListener("message", function(event) {
    const { fieldId, selectedPath, fileName, nextBrowserPath } = event.data;
    if (fieldId && selectedPath) {
        const input = document.getElementById(fieldId);
        const browser = document.getElementById("browser-" + fieldId);
        const button = document.querySelector(`.browse-btn[data-target="${fieldId}"]`);
        const arrow = button?.querySelector(".arrow");
        const label = document.getElementById("selected-name-" + fieldId);

        if (nextBrowserPath) lastBrowserPath = nextBrowserPath;
        if (input) input.value = selectedPath;
        if (input?.dataset.stepIndex !== undefined && input?.dataset.fieldName) {
            const stepIndex = parseInt(input.dataset.stepIndex, 10);
            const fieldName = input.dataset.fieldName;
            if (!Number.isNaN(stepIndex) && workflow.steps[stepIndex]) {
                workflow.steps[stepIndex].extras[fieldName] = selectedPath;
            }
        }
        if (label) label.textContent = `Selected: ${selectedPath}`;
        if (browser) browser.style.display = "none";
        if (arrow) arrow.textContent = "▼";
    }
});

$(document).on("input change", ".workflow-editable-field", function () {
    const stepIndex = parseInt($(this).data("step-index"), 10);
    const fieldName = $(this).data("field-name");
    const fieldType = $(this).data("field-type");
    if (Number.isNaN(stepIndex) || !workflow.steps[stepIndex] || !fieldName) return;

    let value = $(this).val();
    if (["number", "integer", "float"].includes(fieldType)) {
        value = value === ""
            ? ""
            : (fieldType === "integer" ? parseInt(value, 10) : parseFloat(value));
        if (Number.isNaN(value)) {
            value = "";
        }
    }

    workflow.steps[stepIndex].extras[fieldName] = value;
});

$(document).ready(function () {
    fetchTemplates();
    setupBrowseButtons();
});
</script>
{% endblock %}
