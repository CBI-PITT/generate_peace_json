{% with messages = get_flashed_messages() %}
{% if messages %}
    <div class="notification is-danger">
        {{ messages[0] }}. Go to <a href="{{ url_for('login') }}">login page</a>.
    </div>
{% endif %}
{% endwith %}

{% extends "flask_file_browser/ffbbase.html" %}

{% block ffbcontent %}
<div class="column is-4 is-offset-4">
    <h3 class="title">Reset Password</h3>
    <div class="box">
        <form method="POST">
            <div class="mb-3">
                <input name="username" placeholder="Username" required class="form-control"><br>
            </div>
            <div class="mb-3">
                <input name="old_password" type="password" placeholder="Old Password" required class="form-control"><br>
            </div>
            <div class="mb-3">
                <input name="new_password" type="password" placeholder="New Password" required class="form-control"><br>
            </div>
            <div class="mb-3">
                <input name="confirm_password" type="password" placeholder="Confirm New Password" required class="form-control"><br>
            </div>
          <button type="submit" class="button is-block is-info is-large is-fullwidth">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
